      --green: #047857;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 22px 28px 18px;
      background: #111827;
      color: #fff;
      border-bottom: 4px solid #d92d20;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: #d1d5db;
      font-size: 13px;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      padding: 12px 28px;
      background: rgba(246, 247, 249, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      padding: 0 12px;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 28px 0;
    }
    .summary-item {
      min-height: 58px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .summary-item b {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .summary-item span {
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      padding: 18px 28px 28px;
    }
    section {
      min-width: 0;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 12px;
    }
    .section-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
    }
    .section-toggle:hover {
      text-decoration: none;
    }
    .arrow {
      display: inline-block;
      width: 18px;
      color: var(--muted);
      font-size: 16px;
      transform: rotate(90deg);
      transition: transform .16s ease;
    }
    section.collapsed .arrow {
      transform: rotate(0deg);
    }
    section.collapsed .section-body {
      display: none;
    }
    h2 {
      margin: 0;
      font-size: 20px;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
    }
    .card {
      margin-bottom: 10px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .card.hot { border-left-color: var(--red); }
    .card.high { border-left-color: var(--amber); }
    .card.mid { border-left-color: var(--blue); }
    .topline {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .rank {
      width: 28px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 5px;
      background: #111827;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--chip);
      font-size: 12px;
      color: #374151;
    }
    .impact.hot { color: var(--red); background: #fee4e2; }
    .impact.high { color: var(--amber); background: #fef3c7; }
    .impact.mid { color: var(--blue); background: #dbeafe; }

    .sentiment.bad { color: #b42318; background: #fee4e2; }
    .sentiment.unknown { color: #475467; background: #eef2f7; }

      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fff1b8;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #f5c542;
    }
    .new-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #047857;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #86efac;
    }
    .trade-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      margin: 10px 0 12px;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
    }
    .trade-cell {
      min-width: 0;
      font-size: 12px;
      line-height: 1.45;
    }
    .trade-cell b {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
    }
    .trade-cell span {
      display: block;
      color: var(--ink);
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    h3 {
      margin: 2px 0 10px;
      font-size: 17px;
      line-height: 1.45;
    }
    p {
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.8;
    }
    .label {
      color: var(--muted);
      display: inline-block;
      font-size: 15px;
      font-weight: 800;
      margin-right: 4px;
    }
    a {
      color: #175cd3;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { text-decoration: underline; }
    .risk {
      color: #475467;
    }
    .detail-line {
      max-width: 96%;
    }
    .source-line {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: right;
    }
    .source-line .label {
      font-size: 12px;
      font-weight: 700;
      margin-right: 0;
    }
    .source-line a {
      font-size: 12px;
    }
    .day-offset {
      color: var(--red);
      font-weight: 800;
      margin-left: 3px;
    }
    footer {
      padding: 0 28px 26px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    @media (max-width: 980px) {

      header, .toolbar, .summary-bar, main, footer { padding-left: 16px; padding-right: 16px; }
    }
    @media print {
      .toolbar { display: none; }

      .card { box-shadow: none; break-inside: avoid; }
      a { color: #111827; }
    }
  </style>

    function attentionLevel(item) {
      const text = `${item.title}${item.sector}${item.related}`;
      if (item.level === "hot" || includesAny(text, ["AI", "半导体", "机器人", "算力", "存储", "PCB", "端侧", "数据中心"])) return "高";
      if (item.level === "high" || includesAny(text, ["消费", "出口", "有色", "油气", "券商", "电力"])) return "中";
      return "低";
    }

    function tradeAction(item) {
      const text = `${item.title}${item.risk}${item.related}`;
      if (item.sentiment === "利空") return "避险";
      if (includesAny(text, ["高位", "溢价", "抽血", "扰动", "分歧"])) return "谨慎追高";
      if (item.sentiment === "未知") return item.level === "hot" ? "只看龙头" : "观察";
      if (attentionLevel(item) === "高") return "只看龙头";
      return "可参与";
    }

    function certaintyScore(item) {
      const text = `${item.source}${item.title}${item.fact}`;
      if (includesAny(text, ["国家统计局", "海关总署", "国家能源局", "上海证券交易所", "美国劳工统计局", "EIA", "Federal Reserve", "Eurostat"])) return "5星";
      if (includesAny(text, ["国家发展改革委", "ASML", "TSMC", "WSTS", "IEA", "OPEC", "SEMI", "工信"])) return "4星";
      if (includesAny(text, ["财联社", "科创板日报", "证券时报"])) return "3星";
      if (includesAny(text, ["Financial Times", "外媒"])) return "3星";
      return "3星";
    }

    function riskLevel(item) {
      const text = `${item.title}${item.risk}${item.sentiment}`;
      if (item.sentiment === "利空" || includesAny(text, ["高位", "溢价", "抽血", "扰动", "外媒", "地缘", "关税", "管制", "退市"])) return "高";
      if (includesAny(text, ["分歧", "兑现", "周期", "审批", "不确定", "价格波动", "未必", "传导偏间接"])) return "中";
      return "低";
    }

    function isFocusItem(item) {
      return item.level === "hot"
        && item.sentiment === "利好"
        && attentionLevel(item) === "高"
        && riskLevel(item) !== "高";
    }

    function updateSummary(list) {
      const summary = list.reduce((acc, item) => {
        if (item.sentiment === "利好") acc.good += 1;
        if (item.sentiment === "利空") acc.bad += 1;
        if (item.sentiment === "未知") acc.unknown += 1;
        if (attentionLevel(item) === "高") acc.highAttention += 1;
        if (riskLevel(item) === "高") acc.highRisk += 1;
        if (isNewItem(item) && item.side === "国内") acc.newDomestic += 1;
        if (isNewItem(item) && item.side === "国际") acc.newIntl += 1;
        return acc;
      }, { good: 0, bad: 0, unknown: 0, highAttention: 0, highRisk: 0, newDomestic: 0, newIntl: 0 });

      document.getElementById("goodCount").textContent = summary.good;
      document.getElementById("badCount").textContent = summary.bad;
      document.getElementById("unknownCount").textContent = summary.unknown;
      document.getElementById("highAttentionCount").textContent = summary.highAttention;
      document.getElementById("highRiskCount").textContent = summary.highRisk;
      document.getElementById("newDomesticCount").textContent = summary.newDomestic;
      document.getElementById("newIntlCount").textContent = summary.newIntl;
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const level = document.getElementById("level").value;
      const sortBy = document.getElementById("sortBy").value;
      const newOnly = document.getElementById("newOnly").value;
      const filtered = items.filter(item => {
        const blob = Object.values(item).join(" ").toLowerCase();
        return (!level || item.level === level)
          && (!q || blob.includes(q))
          && (!newOnly || isNewItem(item));
      }).sort((a, b) => compareItems(a, b, sortBy));

      Object.values(rootMap).forEach(el => el.innerHTML = "");
      updateSummary(filtered);
      let intl = 0;
      let domestic = 0;

      filtered.forEach((item, index) => {
        if (item.side === "国际") intl += 1; else domestic += 1;
        const rank = item.side === "国际" ? intl : domestic;
        const card = document.createElement("article");
        card.className = `card ${item.level}`;
        card.innerHTML = `
          <div class="topline">
            <span class="rank">${String(rank).padStart(2, "0")}</span>
            <span class="line">${item.side}线</span>
            <span class="impact ${item.level}">重要度：${levelText[item.level]}</span>
            <span class="sentiment ${sentimentClass[item.sentiment]}">${item.sentiment}</span>
            ${isNewItem(item) ? '<span class="new-badge">新增</span>' : ''}
            ${isFocusItem(item) ? '<span class="focus-badge">重点观察</span>' : ''}
            <span class="tag">${item.sector}</span>
          </div>
          <div class="trade-grid">
            <div class="trade-cell"><b>催化类型</b><span>${catalystType(item)}</span></div>
            <div class="trade-cell"><b>影响周期</b><span>${impactHorizon(item)}</span></div>
            <div class="trade-cell"><b>资金关注度</b><span>${attentionLevel(item)}</span></div>
            <div class="trade-cell"><b>交易方向</b><span>${tradeAction(item)}</span></div>
            <div class="trade-cell"><b>确定性评分</b><span>${certaintyScore(item)}</span></div>
            <div class="trade-cell"><b>风险等级</b><span>${riskLevel(item)}</span></div>
          </div>
          <h3>${item.title}</h3>
          <p class="detail-line"><span class="label">事实：</span>${item.fact}</p>
          <p class="detail-line"><span class="label">A股映射：</span>${item.map}</p>
          <p class="detail-line"><span class="label">相关板块或个股：</span>${item.related}</p>
          <p class="detail-line risk"><span class="label">风险：</span>${item.risk}</p>
          <p class="source-line"><span><span class="label">来源：</span><a href="${item.url}" target="_blank" rel="noopener">${item.source}</a></span><span><span class="label">发布时间：</span>${sourceTimeHtml(item)}</span></p>
        `;
        rootMap[item.side].appendChild(card);
      });

      document.getElementById("intlCount").textContent = `显示 ${intl} / 10`;
      document.getElementById("domesticCount").textContent = `显示 ${domestic} / 10`;
    }

    document.getElementById("q").addEventListener("input", render);
    document.getElementById("level").addEventListener("change", render);
    document.getElementById("sortBy").addEventListener("change", render);
    document.getElementById("newOnly").addEventListener("change", render);
    document.querySelectorAll(".section-toggle").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById(button.dataset.target).classList.toggle("collapsed");
      });
    });
    render();
    localStorage.setItem(snapshotKey, JSON.stringify(items.map(stableId)));
    localStorage.setItem(snapshotTimeKey, currentSnapshotTime);
  </script>
</body>
</html>
